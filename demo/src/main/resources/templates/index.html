<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minhas Tarefas (AC1)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    </style>
</head>
<body>

<h2>Cadastrar Nova Tarefa</h2>
<!-- Formulário que envia os dados para a rota /salvar do Controlador -->
<form action="/salvar" method="POST">
    <label>Título:</label><br>
    <input type="text" name="titulo" required><br><br>

    <label>Descrição:</label><br>
    <input type="text" name="descricao" required><br><br>

    <button type="submit">Salvar Tarefa</button>
</form>

<hr>

<h2>Lista de Tarefas</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Descrição</th>
    </tr>
    </thead>
    <tbody>
    <!-- Laço de repetição (for) do Thymeleaf para listar os dados do banco -->
    <tr th:each="tarefa : ${tarefas}">
        <td th:text="${tarefa.id}"></td>
        <td th:text="${tarefa.titulo}"></td>
        <td th:text="${tarefa.descricao}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
