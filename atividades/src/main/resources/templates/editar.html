<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Tarefa (AC2)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .cancelar { margin-left: 10px; color: red; text-decoration: none; }
    </style>
</head>
<body>

<h2>Editar Tarefa</h2>

<!-- Formulário reutilizando a rota /salvar da AC1 -->
<form action="/salvar" method="POST" th:object="${tarefa}">

    <!-- O ID oculto é obrigatório para o Spring fazer o UPDATE no banco -->
    <input type="hidden" th:field="*{id}">

    <label>Título:</label><br>
    <input type="text" th:field="*{titulo}" required><br><br>

    <label>Descrição:</label><br>
    <input type="text" th:field="*{descricao}" required><br><br>

    <button type="submit">Atualizar Tarefa</button>
    <a href="/" class="cancelar">Cancelar</a>
</form>

</body>
</html>
